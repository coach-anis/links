<style>
:root {
  --gold: #C9A84C;
  --gold2: #E8C97A;
  --gold3: #F5DFA0;
  --dark: #080808;
  --dark2: #0F0F0F;
  --dark3: #161616;
  --text: #EFEFEF;
  --dim: #666;
  --border: rgba(201,168,76,0.18);
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }

body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Cairo', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 0 60px;
  overflow-x: hidden;
}

/* ─── BG ─── */
.bg-glow {
  position: fixed; inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(201,168,76,0.09) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 20% 80%, rgba(201,168,76,0.04) 0%, transparent 50%),
    radial-gradient(ellipse 40% 40% at 80% 60%, rgba(201,168,76,0.03) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}

.bg-grid {
  position: fixed; inset: 0;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(201,168,76,0.02) 60px, rgba(201,168,76,0.02) 61px),
    repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(201,168,76,0.02) 60px, rgba(201,168,76,0.02) 61px);
  pointer-events: none; z-index: 0;
}

.noise {
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0; opacity: .5;
}

/* ─── MAIN ─── */
.wrap {
  width: 100%;
  max-width: 440px;
  padding: 0 20px;
  position: relative;
  z-index: 1;
}

/* ─── PROFILE ─── */
.profile {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 52px 0 32px;
  text-align: center;
}

.avatar-ring {
  position: relative;
  margin-bottom: 18px;
}

.avatar-outer {
  width: 96px; height: 96px;
  border-radius: 50%;
  background: conic-gradient(var(--gold), var(--gold2), var(--gold3), var(--gold));
  padding: 2.5px;
  animation: spinRing 6s linear infinite;
}

@keyframes spinRing {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

.avatar-inner {
  width: 100%; height: 100%;
  border-radius: 50%;
  background: var(--dark2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  border: 2px solid var(--dark2);
}

.verified {
  position: absolute;
  bottom: 2px; left: 2px;
  width: 24px; height: 24px;
  background: var(--gold);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  border: 2px solid var(--dark);
}

.profile-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 32px;
  letter-spacing: 3px;
  line-height: 1;
  margin-bottom: 4px;
}

.profile-name span { color: var(--gold); }

.profile-handle {
  font-size: 13px;
  color: var(--gold);
  opacity: 0.7;
  letter-spacing: 1px;
  margin-bottom: 10px;
  font-family: 'Bebas Neue', sans-serif;
}

.profile-bio {
  font-size: 13px;
  color: var(--dim);
  line-height: 1.8;
  max-width: 300px;
}

.profile-bio strong { color: var(--text); }

/* ─── STATS ─── */
.stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  margin: 20px 0 32px;
  padding: 16px 28px;
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 14px;
  width: 100%;
}

.stat { text-align: center; }

.stat-num {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 24px;
  color: var(--gold2);
  line-height: 1;
}

.stat-label {
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 1px;
  margin-top: 3px;
}

.stat-divider {
  width: 1px;
  background: var(--border);
  align-self: stretch;
}

/* ─── SECTION LABEL ─── */
.sec-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--gold);
  opacity: 0.5;
  margin-bottom: 12px;
  text-align: center;
}

/* ─── LINKS ─── */
.links {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 28px;
  width: 100%;
}

.link-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 20px;
  border-radius: 12px;
  text-decoration: none;
  color: var(--text);
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
  opacity: 0;
  animation: linkIn 0.4s ease forwards;
}

.link-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(201,168,76,0.06), transparent);
  opacity: 0;
  transition: opacity 0.25s;
}

.link-btn:hover::before { opacity: 1; }
.link-btn:hover { transform: translateX(-4px); border-color: rgba(201,168,76,0.5) !important; }
.link-btn:active { transform: translateX(-2px) scale(0.99); }

@keyframes linkIn {
  from { opacity:0; transform: translateY(16px); }
  to   { opacity:1; transform: translateY(0); }
}

.link-btn:nth-child(1) { animation-delay: 0.1s; }
.link-btn:nth-child(2) { animation-delay: 0.18s; }
.link-btn:nth-child(3) { animation-delay: 0.26s; }
.link-btn:nth-child(4) { animation-delay: 0.34s; }
.link-btn:nth-child(5) { animation-delay: 0.42s; }
.link-btn:nth-child(6) { animation-delay: 0.50s; }
.link-btn:nth-child(7) { animation-delay: 0.58s; }

.link-icon {
  width: 42px; height: 42px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}

.link-text { flex: 1; }
.link-title { font-size: 14px; font-weight: 700; line-height: 1.2; }
.link-sub { font-size: 11px; color: var(--dim); margin-top: 2px; }

.link-arrow {
  font-size: 14px;
  color: var(--gold);
  opacity: 0.5;
  transition: opacity 0.2s;
}

.link-btn:hover .link-arrow { opacity: 1; }

/* Link styles */
.link-primary {
  background: linear-gradient(135deg, #141008, #1c1608);
  border: 1px solid rgba(201,168,76,0.35);
}

.link-default {
  background: var(--dark2);
  border: 1px solid var(--border);
}

.link-wa .link-icon { background: rgba(37,211,102,0.1); }
.link-ig .link-icon { background: rgba(225,48,108,0.1); }
.link-tt .link-icon { background: rgba(255,255,255,0.05); }
.link-services .link-icon { background: rgba(201,168,76,0.1); }
.link-calc .link-icon { background: rgba(122,184,232,0.1); }
.link-quiz .link-icon { background: rgba(232,201,122,0.1); }
.link-recipes .link-icon { background: rgba(122,200,122,0.1); }
.link-cals .link-icon { background: rgba(201,168,76,0.12); }

/* ─── FEATURED BADGE ─── */
.featured-badge {
  position: absolute;
  top: 10px; left: 10px;
  background: var(--gold);
  color: var(--dark);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 1px;
  padding: 2px 7px;
  border-radius: 10px;
  font-family: 'Bebas Neue', sans-serif;
}

/* ─── FOOTER ─── */
.footer {
  text-align: center;
  margin-top: 20px;
}

.footer-tag {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--dim);
  opacity: 0.4;
}

.footer-divider {
  width: 40px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 12px auto;
}

/* ─── LIGHT THEME ─── */
body.light {
  --gold: #B8923F;
  --gold2: #9A7A30;
  --gold3: #C4A35A;
  --dark: #F5F2EB;
  --dark2: #FFFFFF;
  --dark3: #EBE6DC;
  --text: #1A1916;
  --dim: #6B6560;
  --border: rgba(184,146,63,0.22);
}
body.light {
  background: var(--dark);
  color: var(--text);
}
body.light .link-primary {
  background: linear-gradient(135deg, #F8F4EA, #FFFFFF);
  border-color: rgba(184,146,63,0.4);
}
body.light .featured-badge { color: #fff; }
body.light .avatar-inner { background: var(--dark2); border-color: var(--dark2); }
body.light .verified { border-color: var(--dark); }

/* Top controls */
.top-controls {
  position: relative;
  width: 100%;
  max-width: 440px;
  margin: 0 auto;
  padding: 14px 20px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}
.theme-toggle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--dark2);
  color: var(--gold2);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  transition: border-color .2s, transform .2s;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  flex-shrink: 0;
}
.theme-toggle:hover {
  border-color: var(--gold);
  transform: scale(1.06);
}
.lang-switch {
  display: flex;
  gap: 4px;
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 4px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}
.lang-btn {
  font-family: 'Cairo', sans-serif;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 11px;
  border-radius: 20px;
  border: none;
  background: transparent;
  color: var(--dim);
  cursor: pointer;
  transition: all .2s;
}
.lang-btn:hover { color: var(--gold2); }
.lang-btn.active {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  color: #0a0800;
}
body.light .lang-btn.active { color: #fff; }
@media (max-width: 480px) {
  .top-controls { padding: 10px 16px 0; }
  .theme-toggle { width: 36px; height: 36px; font-size: 16px; }
  .lang-btn { font-size: 11px; padding: 5px 9px; }
}

</style>
</head>

    profileBio: "Coach musculation · Nutrition sportive",

    linkRecipes: "Free Recipes",
    badgeHot: "HOT",

    footer: "ALL RIGHTS RESERVED"
  }
};

let currentLang = 'ar';

function applyLanguage(lang) {
  currentLang = lang;
  const t = I18N[lang] || I18N.ar;
  document.documentElement.setAttribute('lang', lang);
  document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
  });

  // Arrow direction for LTR
  document.querySelectorAll('.link-arrow').forEach(el => {
    el.textContent = lang === 'ar' ? '←' : '→';
  });

  try { localStorage.setItem('links-lang', lang); } catch(e) {}
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => applyLanguage(btn.getAttribute('data-lang')));
});

// Theme
(function() {
  const btn = document.getElementById('themeToggle');
  function applyTheme(mode) {
    if (mode === 'light') {
      document.body.classList.add('light');
      if (btn) btn.textContent = '☀️';
    } else {
      document.body.classList.remove('light');
      if (btn) btn.textContent = '🌙';
    }
    try { localStorage.setItem('links-theme', mode); } catch(e) {}
  }
  var saved = 'dark';
  try { saved = localStorage.getItem('links-theme') || 'dark'; } catch(e) {}
  applyTheme(saved);
  if (btn) {
    btn.addEventListener('click', function() {
      applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
    });
  }
})();

var savedLang = 'ar';
try { savedLang = localStorage.getItem('links-lang') || 'ar'; } catch(e) {}
applyLanguage(savedLang);
</script>
